options {
    directory "/var/cache/bind";

    listen-on { any; };
    listen-on-v6 { any; };

    allow-query {
        192.168.10.0/24;
    };

    recursion yes;
};

zone "cloudmatrix.local" {
    type master;
    file "/etc/bind/db.cloudmatrix.local";
};

zone "10.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/db.192.168.10";
};